
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendSmart - Expense Tracker</title>
    <link rel="stylesheet" href="script.css">
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>Welcome to SpendSmart</h1>
                <p>Track your expenses, manage your budget and achieve your goals.</p>
            </div>
        </header>

        <section class="dashboard">
            <div class="card spending">
                <p>Total Spending</p>
                <h2 id="totalSpending">₹ 0.00</h2>
            </div>

            <div class="card expenses">
                <p>Number of Expenses</p>
                <h2 id="expenseCount">0</h2>
            </div>

            <div class="card remaining">
                <p>Remaining Budget</p>
                <h2 id="remainingBudget">₹ 0.00</h2>
            </div>
        </section>

        <section class="budget-section">
            <label for="budget">Monthly Budget (₹)</label>
            <input type="number" id="budget" placeholder="Enter your budget" min="0" step="0.01">
            <button id="saveBudget">Save Budget</button>
        </section>

        <section class="form-section">
            <h3>Add Expense</h3>
            <form id="expenseForm">
                <div class="form-group">
                    <label>Expense Name <span>*</span></label>
                    <input type="text" id="expenseName" placeholder="e.g. food" required>
                </div>
                <div class="form-group">
                    <label>Amount</label>
                    <input type="number" id="amount"
                           placeholder="e.g. 400" min="1" required>
                </div>
                <div class="form-group">
                    <label for="category">Category <span>*</span></label>
                    <select id="category" required>
                        <option value="">Select category</option>
                        <option>Food</option>
                        <option>Transport</option>
                        <option>Shopping</option>
                        <option>Education</option>
                        <option>Entertainment</option>
                        <option>Bills</option>
                        <option>Health</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="date" required>
                </div>

                <button type="submit" class="add-btn">
                    + Add Expense
                </button>

            </form>
        </section>

    <script src="script.js"></script>
</body>
</html>
